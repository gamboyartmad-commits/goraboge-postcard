<style>
/* Layout: one landscape photograph that plays by itself; small paper captions sit next to the element that vanishes.
   Narration floats in the middle of the photo; the closing line is written on a letter pulled half out of a postcard envelope. One bright vintage palette (single-theme by design); only the emptied moment turns black and white. */
:root{
  --page:#efe6d3; --paper:#f1e5cb; --paper-edge:#cdb68c; --ink:#33261a; --ink-soft:#6b5640; --stamp:#a5432e; --cream:#f6eedb;
  --f-body:"Gowun Batang","AppleMyungjo","Nanum Myeongjo","Batang",serif;
  color-scheme: light;
}
html{height:100%}
html,body{background:var(--page);color:var(--ink)}
body{margin:0;min-height:100%;font-family:var(--f-body);display:grid;place-items:center;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
.jeju{width:100%;max-width:1673px;margin:0 auto;container-type:inline-size}
.frame{position:relative;width:100%;aspect-ratio:1673/940;overflow:hidden;border-radius:3px;background:#3a2e22;
  box-shadow:0 14px 38px rgba(90,62,30,.28)}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:58% 56%}
.grain{position:absolute;inset:-20%;background-image:var(--noise);background-size:160px 160px;opacity:.12;mix-blend-mode:overlay;
  animation:grain 1.1s steps(6) infinite;pointer-events:none}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* element tags next to what vanishes */
.cap{position:absolute;margin:0;background:var(--paper);color:var(--ink);line-height:1.6;border-radius:2px;
  box-shadow:0 6px 18px rgba(0,0,0,.42),inset 0 0 0 1px var(--paper-edge);
  opacity:0;transform:translateY(.5em) rotate(-.6deg);transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.cap.on{opacity:1;transform:rotate(-.6deg)}
.cap.tag{font-size:clamp(10px,1.25cqi,19px);font-weight:700;padding:.3em .75em .35em;white-space:nowrap;display:flex;align-items:center;gap:.45em}
.cap.tag::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--stamp);flex:none}

/* narration in the middle of the photo */
.narr{position:absolute;left:50%;top:47%;width:min(74%,48em);transform:translate(-50%,-44%);text-align:center;color:var(--ink);
  isolation:isolate;word-break:keep-all;text-wrap:balance;opacity:0;transition:opacity .35s ease,transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.narr.on{opacity:1;transform:translate(-50%,-50%)}
.narr::before{content:"";position:absolute;inset:-70% -16%;z-index:-1;
  background:radial-gradient(closest-side,rgba(248,241,226,.92),rgba(248,241,226,.72) 55%,rgba(248,241,226,0))}
.narr[data-cap="climax"]::before{background:radial-gradient(closest-side,rgba(246,246,244,.92),rgba(246,246,244,.7) 55%,rgba(246,246,244,0))}
.narr[data-cap="climax"]{color:#2a2a2a}
.narr[data-cap="climax"] .sub{color:#555}
.narr p{margin:0;font-size:clamp(13px,2.25cqi,34px);font-weight:700;line-height:1.5;text-shadow:0 0 10px rgba(255,250,238,.9),0 0 2px rgba(255,250,238,.9)}
.narr .sub{font-size:clamp(11px,1.55cqi,23px);font-weight:400;margin-top:.45em;color:var(--ink-soft)}

/* closing: a postcard envelope rises, a letter slides half out */
.frame{--pw:40cqi;--ey:46%}
.endscrim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(250,244,230,.1),rgba(250,244,230,.42));opacity:0;transition:opacity .5s ease;pointer-events:none}
.endscrim.on{opacity:1}
.post{position:absolute;left:50%;top:var(--ey);width:var(--pw);aspect-ratio:100/62;opacity:0;transform:translate(-50%,62cqi) rotate(-7deg);
  transition:transform .75s cubic-bezier(.2,.9,.25,1),opacity .35s ease;filter:drop-shadow(0 1cqi 1.4cqi rgba(90,60,30,.32))}
.post.on{opacity:1;transform:translate(-50%,0) rotate(-1.5deg)}
.post .flap{position:absolute;left:0;right:0;bottom:100%;height:36%;clip-path:polygon(0 100%,50% 4%,100% 100%);
  background-image:var(--noise),linear-gradient(180deg,#b48d58,#c7a26b);background-size:120px,auto;background-blend-mode:soft-light}
.post .back{position:absolute;inset:0;background:#9c7848;border-radius:0 0 3px 3px}
.post .letter{position:absolute;left:6%;width:88%;top:-80.6%;height:140%;background:#f4ead3;color:var(--ink);border-radius:2px;
  --R:max(16px,calc(var(--pw)*.078));--pt:calc(var(--R)*.9);padding:var(--pt) 8% 0;box-shadow:0 .3cqi 1.2cqi rgba(60,40,20,.25),inset 0 0 0 1px rgba(160,130,90,.35);
  background-image:repeating-linear-gradient(180deg,transparent 0 calc(var(--R) - 1px),rgba(125,95,60,.22) calc(var(--R) - 1px) var(--R));
  background-position:0 var(--pt);transform:translateY(65%);transition:transform .85s cubic-bezier(.25,.9,.3,1);word-break:keep-all}
.post.open .letter{transform:translateY(0) rotate(.8deg)}
.post .letter p{margin:0;font-size:var(--f);line-height:var(--R);position:relative;
  top:calc(var(--R) / 2 - var(--f) * .4 - var(--R) * .1)}        /* letters sit just above each rule */
.post .l0{--f:max(13px,calc(var(--pw)*.056));font-weight:700}
.post .l1{--f:max(10.5px,calc(var(--pw)*.033));font-weight:700;text-wrap:balance}
.post .l2{--f:max(10.5px,calc(var(--pw)*.033));color:var(--ink-soft)}
.post .l2 span{display:block;text-wrap:balance}
.post .l1,.post .l2,.post .cta{opacity:0;transition:opacity .5s ease .7s}
.post.open .l1,.post.open .l2,.post.open .cta{opacity:1}
.post .front{position:absolute;inset:0;clip-path:polygon(0 18%,50% 56%,100% 18%,100% 100%,0 100%);border-radius:0 0 3px 3px;
  background-image:var(--noise),linear-gradient(172deg,#d9b983,#c29a61 70%,#b38b55);background-size:120px,auto;background-blend-mode:soft-light}
.post .front::after{content:"";position:absolute;inset:0;background:linear-gradient(28deg,transparent 49.6%,rgba(90,60,30,.18) 50%,transparent 50.6%),
  linear-gradient(-28deg,transparent 49.6%,rgba(90,60,30,.18) 50%,transparent 50.6%)}
.post .mark{position:absolute;left:8%;bottom:16%;font-size:max(9px,calc(var(--pw)*.03));letter-spacing:.18em;color:rgba(70,45,20,.6);font-weight:700}
.post .stamp{position:absolute;right:6%;top:24%;width:17%;opacity:0;transform:rotate(-14deg) scale(1.35);
  transition:opacity .3s ease,transform .45s cubic-bezier(.2,1.6,.4,1);mix-blend-mode:multiply}
.post .stamp.on{opacity:.9;transform:rotate(-14deg) scale(1)}
.cta{display:inline-flex;align-items:center;gap:.4em;margin-top:calc(var(--R) * .5);font:inherit;font-size:max(11px,calc(var(--pw)*.034));font-weight:700;
  padding:.5em 1.1em;border-radius:999px;background:var(--stamp);color:var(--cream);text-decoration:none}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.replay{position:absolute;right:max(2%,env(safe-area-inset-right,0px));top:3.5%;font:inherit;font-size:clamp(11px,1cqi,14px);
  display:inline-flex;align-items:center;gap:.4em;padding:.45em .9em;border-radius:999px;border:1px solid rgba(110,80,50,.45);
  background:rgba(250,244,230,.9);color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s ease}
.replay.on{opacity:1;pointer-events:auto}
.replay:hover{background:#fffaf0}
.replay:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.replay svg{width:1em;height:1em;fill:currentColor}
@container (max-width: 760px){
  .frame{--pw:60cqi;--ey:68%}
  .post .letter{top:-100%;height:160%;padding-left:6%;padding-right:6%}
  .replay{padding:.5em;top:4%}
  .replay .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}
@media (prefers-reduced-motion: reduce){ .grain{animation:none} .cap,.narr,.post,.post .letter,.post .stamp{transition:opacity .4s ease} .post.open .letter{transform:none} .post .letter{transform:none} }

  layers[name] = { name, img, b, c, cs, n, P, inR: new Uint8Array(n).fill(1), allIn: true, remain, rctx, lit, ring, pad };
}
function shadeFor(spots) {
  const c = mk(spots[0].width, spots[0].height), x = c.getContext('2d');
  x.fillStyle = 'rgb(16,10,5)'; x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'destination-out'; spots.forEach(sp => x.drawImage(sp, 0, 0));
  return c;
}

// ---------------- state ----------------
function progress(name, t) {
  const [vs, vd] = VANISH[name], [rs, rd] = REVIVE[name];
  if (t < vs) return 0;
  if (t < rs) return clamp((t - vs) / vd);
  return 1 - clamp((t - rs) / rd);
}
function drawLayer(Ly, P, t) {
  const { b, P: Q, cs, n, inR, rctx, img } = Ly;
  if (reduce) { if (P < 1) { ctx.globalAlpha = 1 - P; ctx.drawImage(img, b.x, b.y); ctx.globalAlpha = 1; } return; }
  if (P <= 0 && Ly.allIn) { ctx.drawImage(img, b.x, b.y); return; }
  // keep the intact part in sync: released cells are cleared, returned cells are painted back
  let all = true;
  for (let i = 0; i < n; i++) {
    const u = (P - Q.r[i] * 0.5) / 0.5;
    if (u > 0) { if (inR[i]) { rctx.clearRect(Q.sx[i], Q.sy[i], cs, cs); inR[i] = 0; } all = false; }
    else if (!inR[i]) { rctx.drawImage(img, Q.sx[i], Q.sy[i], cs, cs, Q.sx[i], Q.sy[i], cs, cs); inR[i] = 1; }
  }
  Ly.allIn = all;
  if (P < 1) ctx.drawImage(Ly.remain, b.x, b.y);
}
function drawDust(Ly, P, pass, rev) {
  if (reduce || P <= 0 || P >= 1) return;
  if (rev && pass) return;                     // no light when things come back
  const { b, P: Q, cs, n, img, lit, c } = Ly;
  const src = pass ? lit : img;
  const reach = rev ? 0.45 : 1;                // returning fragments gather from close by
  for (let i = 0; i < n; i++) {
    const u = (P - Q.r[i] * 0.5) / 0.5;
    if (u <= 0 || u >= 1) continue;
    const e = u * u;
    const X = b.x + Q.sx[i] + Q.vx[i] * c.A * reach * e + Math.sin(Q.ph[i] + u * 6) * Q.amp[i] * 1.6 * u * reach;
    const Y = b.y + Q.sy[i] + Q.vy[i] * c.A * reach * e - 22 * u * reach;
    let s;
    if (rev) {                                 // fragments fade in and grow back to full size as they settle
      s = cs * (0.35 + 0.65 * (1 - u));
      ctx.globalAlpha = Math.pow(1 - u, 1.4) * Q.a[i];
    } else {
      s = cs * (pass ? 0.7 : 1) * (1 + 0.35 * Math.sin(u * Math.PI));
      if (pass) ctx.globalAlpha = Math.sin(Math.min(1, u * 1.35) * Math.PI) * (1 - u * 0.4) * Q.a[i] * 0.07 * (c.glow || 1);   // barely a shimmer
      else { ctx.globalAlpha = Math.pow(1 - u, 1.5) * Q.a[i]; }                                     // fragments keep their own colour as they drift
    }
    ctx.drawImage(src, Q.sx[i], Q.sy[i], cs, cs, X - s / 2 + cs / 2, Y - s / 2 + cs / 2, s, s);
  }
  ctx.globalAlpha = 1;
}
function ringAlpha(name, t) {
  const sc = SCENES.find(s => s.layers.includes(name));
  const [vs, vd] = VANISH[name], [rs, rd] = REVIVE[name];
  const focus = env(t, sc.a, sc.a + 0.15, vs + 0.05, vs + 0.45);          // bright outline before it goes
  const ghost = 0.1 * env(t, vs + vd - 0.25, vs + vd, vs + vd + 0.15, vs + vd + 0.7);   // faint outline of what is gone
  return Math.max(focus, ghost);
}

let k = 1;
function render(t) {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(plate, 0, 0, W, H);
  const prog = {};
  for (const name of ORDER) { prog[name] = progress(name, t); drawLayer(layers[name], prog[name], t); }
  // outline glow (focus / ghost / return)
  ctx.globalCompositeOperation = 'lighter';
  for (const name of ORDER) {
    const a = ringAlpha(name, t); if (a <= 0.01) continue;
    const Ly = layers[name]; ctx.globalAlpha = a * (name === 'road' ? 0.12 : 0.22);
    ctx.drawImage(Ly.ring, Ly.b.x - Ly.pad, Ly.b.y - Ly.pad);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  for (const name of ORDER) drawDust(layers[name], prog[name], 0, t >= REVIVE[name][0]);
  ctx.globalCompositeOperation = 'lighter';
  for (const name of ORDER) drawDust(layers[name], prog[name], 1, t >= REVIVE[name][0]);
  ctx.globalCompositeOperation = 'source-over';
  // aged print on top of everything (dust included)
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(ovMul, 0, 0, W, H);
  ctx.globalCompositeOperation = 'screen'; ctx.drawImage(ovScr, 0, 0, W, H);
  // everything gone: the whole photograph turns black and white, colour returns as the elements come back
  const empty = env(t, T_EMPTY - 0.15, T_EMPTY + 0.35, T_RET + 0.3, T_RET + 1.6);
  if (empty > 0) {
    ctx.globalCompositeOperation = 'saturation'; ctx.globalAlpha = empty; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = 'source-over';
  // a slow push-in while the photograph is empty
  const z = reduce ? 0 : env(t, T_EMPTY - 0.1, T_RET, T_RET, T_RET + 1.0);
  cv.style.transform = z > 0 ? `scale(${1 + 0.035 * z})` : '';
}

// ---------------- captions ----------------
const capEls = {}; document.querySelectorAll('[data-cap]').forEach(el => capEls[el.dataset.cap] = el);
const post = document.getElementById('post'), endscrim = document.getElementById('endscrim');
const stamp = document.getElementById('stamp'), replay = document.getElementById('replay'), cta = document.getElementById('cta');
if (CTA_URL) { cta.href = CTA_URL; cta.hidden = false; }
else if (EMBEDDED && CTA_PARENT) {
  cta.href = '#' + CTA_PARENT; cta.removeAttribute('target'); cta.removeAttribute('rel'); cta.hidden = false;
  cta.addEventListener('click', (e) => {
    e.preventDefault();
    window.parent.postMessage({ type: 'hayeong:scroll-to', target: CTA_PARENT }, '*');   // 민감한 내용이 없어 받는 쪽 주소는 가리지 않는다(부모가 보낸 창을 확인한다)
  });
}
let curCap = null;
const pick = (list, t) => { let id = null; for (const [c, a, b] of list) if (t >= a && t < b) id = c; return id; };
function captions(t) {
  const n = pick(NARR, t), tags = t >= TAG_ON[0] && t < TAG_ON[1], key = n + '|' + tags;
  if (key === curCap) return;
  curCap = key;
  for (const [c, el] of Object.entries(capEls)) el.classList.toggle('on', c === n || (tags && TAGS.includes(c)));
}
function closing(t) {
  post.classList.toggle('on', t >= T_END);
  endscrim.classList.toggle('on', t >= T_END);
  post.classList.toggle('open', t >= OPEN_AT);
  stamp.classList.toggle('on', t >= STAMP_AT);
  replay.classList.toggle('on', t >= REPLAY_AT);
}

// ---------------- playback ----------------
let t = 0, playing = false, visible = false, last = 0, started = false, raf = 0;
function tick(now) {
  raf = 0;
  if (!playing || !visible) return;          // the observer restarts the loop when the photo is back on screen
  if (!document.hidden) t += Math.min(0.05, (now - last) / 1000);
  last = now;
  render(t); captions(t);
  closing(t);
  if (t >= END) { playing = false; return; }
  raf = requestAnimationFrame(tick);
}
function play(from = 0) {
  t = from; playing = true; started = true; last = performance.now();
  if (!raf) raf = requestAnimationFrame(tick);
}
replay.addEventListener('click', () => { closing(0); curCap = undefined; play(0); });

function size() {
  const r = frame.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  k = clamp((r.width * dpr) / W, 0.4, 1);
  const w = Math.round(W * k), h = Math.round(H * k);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; if (plate) render(t); }
}

async function boot() {
  size();
  const [p, m, s, ...rest] = await Promise.all([load(IMG.plate), load(IMG.mul), load(IMG.scr),
    ...ORDER.map(n => load(IMG[n])), ...SCENES.map(sc => load(IMG['spot_' + sc.g]))]);
  plate = p; ovMul = m; ovScr = s;
  ORDER.forEach((n, i) => buildLayer(n, rest[i]));
  shades.all = shadeFor(rest.slice(ORDER.length));
  render(0);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((es) => {
      for (const e of es) { visible = e.isIntersecting; if (visible && !started) play(0); if (visible && playing && !raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
    }, { threshold: 0.55 }).observe(frame);
  } else { visible = true; play(0); }
}
// lets a host page (or a check) jump to a moment: __jeju.seek(seconds)
window.__jeju = { seek(s) { playing = false; started = true; t = s; render(t); captions(t); closing(t); }, get time() { return t; }, play };
window.addEventListener('resize', size);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
boot();
})();
</script>
